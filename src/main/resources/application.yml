spring:
  application:
    name: atlasroute-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atlasroute}
    username: ${DB_USER:atlasroute}
    password: ${DB_PASSWORD:atlasroute}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

atlasroute:
  security:
    jwt:
      # Em produção, sempre defina JWT_SECRET (mínimo 32 bytes). O valor padrão é só para dev/test
      # e a aplicação avisa no log quando ele está em uso.
      secret: ${JWT_SECRET:atlasroute-dev-secret-NAO-USAR-EM-PRODUCAO-2026}
      expiration: ${JWT_EXPIRATION:1h}
      issuer: atlasroute-api

management:
  endpoints:
    web:
      exposure:
        include: health,info
