spring:
  application:
    name: atlasroute-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atlasroute}
    username: ${DB_USER:atlasroute}
    password: ${DB_PASSWORD:atlasroute}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
