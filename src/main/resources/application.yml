spring:
  application:
    name: atlasroute-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atlasroute}
    username: ${DB_USER:atlasroute}
    password: ${DB_PASSWORD:atlasroute}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

atlasroute:
  security:
    jwt:
      # Obrigatório: sem JWT_SECRET (mínimo 32 bytes) a aplicação não sobe.
      # Gere um com: openssl rand -base64 48
      # Para rodar localmente, use o perfil dev (application-dev.yml), que traz um segredo de dev.
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:1h}
      issuer: atlasroute-api

management:
  endpoints:
    web:
      exposure:
        include: health,info
