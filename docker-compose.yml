services:
  postgres:
    image: postgres:17-alpine
    container_name: atlasroute-postgres
    environment:
      POSTGRES_DB: atlasroute
      POSTGRES_USER: atlasroute
      POSTGRES_PASSWORD: atlasroute
    ports:
      - "5432:5432"
    volumes:
      - atlasroute-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlasroute -d atlasroute"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  atlasroute-data:
